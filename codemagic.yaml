workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter project structure
        script: | 
          #!/usr/bin/env bash
          set -ex
          echo "Backing up main.dart..."
          cp lib/main.dart /tmp/main.dart.bak || true
          echo "Running flutter create..."
          flutter create --org com.tawasul --project-name tawasul_pro .
          echo "Restoring main.dart..."
          cp /tmp/main.dart.bak lib/main.dart
          echo "Android folder created successfully"
          ls -la android
      - name: Get dependencies
        script: | 
          flutter pub get
      - name: Build APK
        script: | 
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

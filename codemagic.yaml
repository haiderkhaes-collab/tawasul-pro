workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Android project + Fix compileSdk 36
        script: |
          flutter create --org com.tawasul --project-name tawasul_pro --platforms=android .
          
          # Fix 1: app level
          sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i '' 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          
          # Fix 2: Root build.gradle.kts - THIS IS THE CORRECT PLACE
          cat >> android/build.gradle.kts << 'EOF'
          
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

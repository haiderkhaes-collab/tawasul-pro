workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter project structure
        script: |
          #!/usr/bin/env bash
          set -ex
          echo 'Backing up your files...'
          mv lib /tmp/lib_backup
          mv pubspec.yaml /tmp/pubspec_backup
          
          echo 'Cleaning directory...'
          rm -rf *
          
          echo 'Running flutter create...'
          flutter create --org com.tawasul --project-name tawasul_pro .
          
          echo 'Updating compileSdkVersion to 34...'
          sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts
          sed -i '' 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts
          
          echo 'Restoring your files...'
          rm -rf lib pubspec.yaml
          mv /tmp/lib_backup lib
          mv /tmp/pubspec_backup pubspec.yaml
          
          echo 'Downgrading Firebase to compatible versions...'
          sed -i '' 's/firebase_core:.*/firebase_core: ^2.24.2/g' pubspec.yaml
          sed -i '' 's/firebase_auth:.*/firebase_auth: ^4.15.3/g' pubspec.yaml
          sed -i '' 's/cloud_firestore:.*/cloud_firestore: ^4.13.6/g' pubspec.yaml
          
          echo "Android folder created successfully"
          ls -la android
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
